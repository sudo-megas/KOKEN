#
# Builds both packages and publishes them when a v* tag is pushed. Nothing
# here runs during development; it runs on GitHub, after the tag.
#
# Container images are pinned by tag rather than by digest, on purpose. A digest
# pin means this workflow stops working the day the image is rebuilt, which for
# a rolling base image is measured in weeks, and the failure would arrive at
# release time.

name: release

on:
  push:
    tags:
      - "v*"
  # A manual button in the Actions tab. A tag push fires this workflow exactly
  # once, when the tag first reaches GitHub; pushing the same tag again is a
  # no-op and produces no event at all, so without this the only way to re-run
  # a release is to delete the tag and push it back. That is a destructive
  # operation to have as the sole retry mechanism.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, for example v1.0"
        required: true
        default: "v1.0"

# Read by default. The two build jobs run distribution build tooling that
# fetches and executes packaging scripts, and there is no reason for the token
# they can see to be able to write to the repository. Only the job that
# publishes the release is given that, below.
permissions:
  contents: read

jobs:
  arch:
    name: Arch package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm \
            git python python-build python-installer python-hatchling \
            python-wheel imagemagick

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # makepkg refuses to run as root and there is no flag to make it. A
      # build user, owning the workspace, is the only way through.
      - name: Create a build user
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      # From inside packaging/, because that is where the PKGBUILD lives and
      # makepkg takes $startdir from the directory it is run in.
      - name: Build
        run: sudo -u builder makepkg -s --noconfirm
        working-directory: packaging

      - name: Show what was built
        run: ls -la packaging/*.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/*.pkg.tar.zst
          if-no-files-found: error

  debian:
    name: Debian package
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates devscripts debhelper dh-python \
            python3-all python3-build python3-installer python3-hatchling \
            imagemagick

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build
        run: dpkg-buildpackage -us -uc -b

      # dpkg-buildpackage writes the .deb one level above the source tree.
      - name: Collect the package
        run: |
          mkdir -p artifacts
          mv ../koken_*_all.deb artifacts/
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: artifacts/*.deb
          if-no-files-found: error

  release:
    name: Publish
    needs: [arch, debian]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the packages
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.pkg.tar.zst' -o -name '*.deb' \) \
            -exec mv {} release/ \;
          ls -la release

      # The release body is the tag's own message, so what is written on the
      # tag is what appears on the release. generate_release_notes is off:
      # a commit list is not a release note.
      #
      # Written to a file rather than through a $GITHUB_OUTPUT heredoc. A
      # heredoc needs a delimiter that cannot appear in the body, and the body
      # here is arbitrary text from a tag - a message containing the delimiter
      # line would end the heredoc early and the remainder of the tag message
      # would be read as workflow output. A file has no delimiter to collide
      # with.
      - name: Take the release body from the tag message
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch --force --tags
          git tag -l --format='%(contents)' "$TAG" > release-body.txt
          wc -c release-body.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release/*
          body_path: release-body.txt
          generate_release_notes: false
          fail_on_unmatched_files: true
